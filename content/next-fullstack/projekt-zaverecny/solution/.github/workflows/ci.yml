name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: file:./data/ci.db
          BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
